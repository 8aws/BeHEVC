name: Build BeHEVC

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── macOS ──────────────────────────────────────────────────────────
          - platform: macos-latest       # ARM runner — build nativo
            target:   aarch64-apple-darwin
            label:    macOS-arm64
            os:       macos

          - platform: macos-latest       # ARM runner — cross-compile a Intel
            target:   x86_64-apple-darwin
            label:    macOS-intel
            os:       macos

          # ── Linux ──────────────────────────────────────────────────────────
          - platform: ubuntu-22.04
            target:   x86_64-unknown-linux-gnu
            label:    Linux-x64
            os:       linux

          - platform: ubuntu-24.04-arm   # runner ARM nativo de GitHub
            target:   aarch64-unknown-linux-gnu
            label:    Linux-arm64
            os:       linux

          # ── Windows ────────────────────────────────────────────────────────
          - platform: windows-latest
            target:   x86_64-pc-windows-msvc
            label:    Windows-x64
            os:       windows

          - platform: windows-11-arm     # runner ARM nativo de GitHub
            target:   aarch64-pc-windows-msvc
            label:    Windows-arm64
            os:       windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: behevc-tauri/src-tauri

      # ── Dependencias Linux ────────────────────────────────────────────────
      - name: Linux — dependencias WebKitGTK
        if: matrix.os == 'linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # ── Descargar ffmpeg ─────────────────────────────────────────────────

      - name: macOS — ffmpeg (evermeet.cx)
        if: matrix.os == 'macos'
        run: |
          mkdir -p behevc-tauri/src-tauri/resources
          curl -fsSL "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o ffmpeg.zip
          unzip -j ffmpeg.zip -d behevc-tauri/src-tauri/resources && rm ffmpeg.zip
          curl -fsSL "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip" -o ffprobe.zip
          unzip -j ffprobe.zip -d behevc-tauri/src-tauri/resources && rm ffprobe.zip
          chmod +x behevc-tauri/src-tauri/resources/ffmpeg
          chmod +x behevc-tauri/src-tauri/resources/ffprobe

      - name: Linux x64 — ffmpeg (BtbN)
        if: matrix.label == 'Linux-x64'
        run: |
          mkdir -p behevc-tauri/src-tauri/resources
          curl -fsSL -L \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
            -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          DIR=$(find . -maxdepth 1 -name 'ffmpeg-master-latest-linux64-gpl' -type d | head -1)
          cp "$DIR/bin/ffmpeg" "$DIR/bin/ffprobe" behevc-tauri/src-tauri/resources/
          chmod +x behevc-tauri/src-tauri/resources/ffmpeg behevc-tauri/src-tauri/resources/ffprobe
          rm -rf ffmpeg.tar.xz "$DIR"

      - name: Linux arm64 — ffmpeg (BtbN)
        if: matrix.label == 'Linux-arm64'
        run: |
          mkdir -p behevc-tauri/src-tauri/resources
          curl -fsSL -L \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz" \
            -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          DIR=$(find . -maxdepth 1 -name 'ffmpeg-master-latest-linuxarm64-gpl' -type d | head -1)
          cp "$DIR/bin/ffmpeg" "$DIR/bin/ffprobe" behevc-tauri/src-tauri/resources/
          chmod +x behevc-tauri/src-tauri/resources/ffmpeg behevc-tauri/src-tauri/resources/ffprobe
          rm -rf ffmpeg.tar.xz "$DIR"

      - name: Windows x64 — ffmpeg (BtbN)
        if: matrix.label == 'Windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "behevc-tauri/src-tauri/resources" | Out-Null
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $bin = (Get-ChildItem ffmpeg_tmp -Directory | Select-Object -First 1).FullName + "\bin"
          Copy-Item "$bin\ffmpeg.exe","$bin\ffprobe.exe" "behevc-tauri/src-tauri/resources/"
          Remove-Item ffmpeg.zip,ffmpeg_tmp -Recurse -Force

      - name: Windows arm64 — ffmpeg (BtbN)
        if: matrix.label == 'Windows-arm64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "behevc-tauri/src-tauri/resources" | Out-Null
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-winarm64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $bin = (Get-ChildItem ffmpeg_tmp -Directory | Select-Object -First 1).FullName + "\bin"
          Copy-Item "$bin\ffmpeg.exe","$bin\ffprobe.exe" "behevc-tauri/src-tauri/resources/"
          Remove-Item ffmpeg.zip,ffmpeg_tmp -Recurse -Force

      # ── Build ─────────────────────────────────────────────────────────────
      - name: npm install
        working-directory: behevc-tauri
        run: npm install

      - name: tauri build
        working-directory: behevc-tauri
        run: npm run tauri build -- --target ${{ matrix.target }}

      # ── Artefactos ────────────────────────────────────────────────────────
      - name: Upload — macOS DMG
        if: matrix.os == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: BeHEVC-${{ matrix.label }}
          path: behevc-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload — Windows
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: BeHEVC-${{ matrix.label }}
          path: |
            behevc-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            behevc-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload — Linux AppImage
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: BeHEVC-${{ matrix.label }}
          path: behevc-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

name: Build BeHEVC

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── macOS ──────────────────────────────────────────────────────────
          - platform: macos-latest       # ARM runner — build nativo
            target:   aarch64-apple-darwin
            label:    macOS-arm64
            os:       macos

          - platform: macos-latest       # ARM runner — cross-compile a Intel
            target:   x86_64-apple-darwin
            label:    macOS-intel
            os:       macos

          # ── Linux ──────────────────────────────────────────────────────────
          - platform: ubuntu-22.04
            target:   x86_64-unknown-linux-gnu
            label:    Linux-x64
            os:       linux

          - platform: ubuntu-24.04-arm   # runner ARM nativo de GitHub
            target:   aarch64-unknown-linux-gnu
            label:    Linux-arm64
            os:       linux

          # ── Windows ────────────────────────────────────────────────────────
          - platform: windows-latest
            target:   x86_64-pc-windows-msvc
            label:    Windows-x64
            os:       windows

          - platform: windows-11-arm     # runner ARM nativo de GitHub
            target:   aarch64-pc-windows-msvc
            label:    Windows-arm64
            os:       windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    # Necesario para que los jobs puedan subir assets al Release en los tags.
    permissions:
      contents: write

    # Exponer los secrets como env para poder condicionar pasos con `if: env.X != ''`.
    # Si un secret no está configurado, ese paso se salta y el build sale sin firmar.
    env:
      APPLE_CERTIFICATE:          ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY:     ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID:                   ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD:             ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID:              ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD:          ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: behevc-tauri/src-tauri

      # ── Dependencias Linux ────────────────────────────────────────────────
      - name: Linux — dependencias WebKitGTK
        if: matrix.os == 'linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # ── Descargar ffmpeg ─────────────────────────────────────────────────

      # ffmpeg POR ARQUITECTURA (martin-riedl.de — builds nativos, firmados y
      # notarizados). Antes ambos targets macOS usaban evermeet.cx (solo Intel),
      # con lo que el DMG arm64 acababa con un ffmpeg x86_64 corriendo en Rosetta.
      - name: macOS arm64 — ffmpeg (nativo arm64)
        if: matrix.label == 'macOS-arm64'
        run: |
          mkdir -p behevc-tauri/src-tauri/resources
          base="https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release"
          curl -fsSL -L "$base/ffmpeg.zip"  -o ffmpeg.zip
          unzip -j ffmpeg.zip  -d behevc-tauri/src-tauri/resources && rm ffmpeg.zip
          curl -fsSL -L "$base/ffprobe.zip" -o ffprobe.zip
          unzip -j ffprobe.zip -d behevc-tauri/src-tauri/resources && rm ffprobe.zip
          chmod +x behevc-tauri/src-tauri/resources/ffmpeg behevc-tauri/src-tauri/resources/ffprobe
          file behevc-tauri/src-tauri/resources/ffmpeg | grep -q arm64 || (echo "ffmpeg no es arm64" && exit 1)

      - name: macOS Intel — ffmpeg (nativo x86_64)
        if: matrix.label == 'macOS-intel'
        run: |
          mkdir -p behevc-tauri/src-tauri/resources
          base="https://ffmpeg.martin-riedl.de/redirect/latest/macos/amd64/release"
          curl -fsSL -L "$base/ffmpeg.zip"  -o ffmpeg.zip
          unzip -j ffmpeg.zip  -d behevc-tauri/src-tauri/resources && rm ffmpeg.zip
          curl -fsSL -L "$base/ffprobe.zip" -o ffprobe.zip
          unzip -j ffprobe.zip -d behevc-tauri/src-tauri/resources && rm ffprobe.zip
          chmod +x behevc-tauri/src-tauri/resources/ffmpeg behevc-tauri/src-tauri/resources/ffprobe
          file behevc-tauri/src-tauri/resources/ffmpeg | grep -q x86_64 || (echo "ffmpeg no es x86_64" && exit 1)

      # ── Firma de código macOS (condicional: solo si hay certificado) ──────
      - name: macOS — importar certificado Developer ID
        if: matrix.os == 'macos' && env.APPLE_CERTIFICATE != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KC_PASS="${KEYCHAIN_PASSWORD:-tmp-ci-pass}"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"

      # ffmpeg/ffprobe están en resources/ (no son sidecars que Tauri firme solo),
      # así que hay que firmarlos con hardened runtime ANTES del build para que la
      # notarización del .app no falle por binarios sin firmar.
      - name: macOS — firmar ffmpeg/ffprobe (hardened runtime)
        if: matrix.os == 'macos' && env.APPLE_CERTIFICATE != ''
        run: |
          for bin in ffmpeg ffprobe; do
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "behevc-tauri/src-tauri/resources/$bin"
          done
          codesign -dv behevc-tauri/src-tauri/resources/ffmpeg 2>&1 | grep -i "Authority" || true

      - name: Linux x64 — ffmpeg (BtbN)
        if: matrix.label == 'Linux-x64'
        run: |
          mkdir -p behevc-tauri/src-tauri/resources
          curl -fsSL -L \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
            -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          DIR=$(find . -maxdepth 1 -name 'ffmpeg-master-latest-linux64-gpl' -type d | head -1)
          cp "$DIR/bin/ffmpeg" "$DIR/bin/ffprobe" behevc-tauri/src-tauri/resources/
          chmod +x behevc-tauri/src-tauri/resources/ffmpeg behevc-tauri/src-tauri/resources/ffprobe
          rm -rf ffmpeg.tar.xz "$DIR"

      - name: Linux arm64 — ffmpeg (BtbN)
        if: matrix.label == 'Linux-arm64'
        run: |
          mkdir -p behevc-tauri/src-tauri/resources
          curl -fsSL -L \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz" \
            -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          DIR=$(find . -maxdepth 1 -name 'ffmpeg-master-latest-linuxarm64-gpl' -type d | head -1)
          cp "$DIR/bin/ffmpeg" "$DIR/bin/ffprobe" behevc-tauri/src-tauri/resources/
          chmod +x behevc-tauri/src-tauri/resources/ffmpeg behevc-tauri/src-tauri/resources/ffprobe
          rm -rf ffmpeg.tar.xz "$DIR"

      - name: Windows x64 — ffmpeg (BtbN)
        if: matrix.label == 'Windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "behevc-tauri/src-tauri/resources" | Out-Null
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $bin = (Get-ChildItem ffmpeg_tmp -Directory | Select-Object -First 1).FullName + "\bin"
          Copy-Item "$bin\ffmpeg.exe","$bin\ffprobe.exe" "behevc-tauri/src-tauri/resources/"
          Remove-Item ffmpeg.zip,ffmpeg_tmp -Recurse -Force

      - name: Windows arm64 — ffmpeg (BtbN)
        if: matrix.label == 'Windows-arm64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "behevc-tauri/src-tauri/resources" | Out-Null
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-winarm64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $bin = (Get-ChildItem ffmpeg_tmp -Directory | Select-Object -First 1).FullName + "\bin"
          Copy-Item "$bin\ffmpeg.exe","$bin\ffprobe.exe" "behevc-tauri/src-tauri/resources/"
          Remove-Item ffmpeg.zip,ffmpeg_tmp -Recurse -Force

      # ── Smoke test: el ffmpeg incluido codifica HEVC en esta plataforma ────
      - name: Smoke test ffmpeg (libx265)
        if: matrix.os != 'windows'
        run: |
          FF=behevc-tauri/src-tauri/resources/ffmpeg
          "$FF" -hide_banner -v error -f lavfi -i testsrc2=size=320x240:rate=24 -t 1 \
            -c:v libx265 -crf 30 -f null - && echo "✔ smoke ffmpeg OK"

      - name: Smoke test ffmpeg (libx265)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          & behevc-tauri/src-tauri/resources/ffmpeg.exe -hide_banner -v error -f lavfi -i testsrc2=size=320x240:rate=24 -t 1 -c:v libx265 -crf 30 -f null -
          if ($LASTEXITCODE -ne 0) { Write-Error "smoke ffmpeg FALLO"; exit 1 }
          Write-Output "smoke ffmpeg OK"

      # ── Build ─────────────────────────────────────────────────────────────
      - name: npm install
        working-directory: behevc-tauri
        run: npm install

      - name: tauri build
        working-directory: behevc-tauri
        run: npm run tauri build -- --target ${{ matrix.target }}

      # ── Publicar en el Release (solo en tags vX.Y.Z) ──────────────────────
      # Cada job sube SU instalador como asset del Release (borrador). Los assets
      # de Release NO cuentan en la cuota de "artifacts" de Actions, así que esto
      # evita el límite de almacenamiento. El primer job crea el borrador y el
      # resto lo van completando con sus archivos.
      - name: Subir instalador(es) al Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: BeHEVC ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            behevc-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            behevc-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            behevc-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            behevc-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      # ── Artefactos solo para runs manuales (depuración) ───────────────────
      # No se ejecuta en tags y nunca tumba el build (continue-on-error) por si
      # la cuota de artifacts está llena.
      - name: Subir artefactos (depuración)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: BeHEVC-${{ matrix.label }}
          if-no-files-found: ignore
          path: |
            behevc-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            behevc-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            behevc-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            behevc-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

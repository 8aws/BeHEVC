name: Build BeHEVC

# Se ejecuta al crear un tag v*.*.* (ej: v0.1.0)
# También se puede lanzar manualmente desde GitHub → Actions → Run workflow
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false   # si una plataforma falla, las demás siguen
      matrix:
        include:
          - platform: macos-latest   # GitHub runner ARM64 (Apple Silicon)
            target:   aarch64-apple-darwin
            label:    macOS-arm64

          - platform: macos-13       # GitHub runner Intel
            target:   x86_64-apple-darwin
            label:    macOS-intel

          - platform: windows-latest
            target:   x86_64-pc-windows-msvc
            label:    Windows-x64

          - platform: ubuntu-22.04
            target:   x86_64-unknown-linux-gnu
            label:    Linux-x64

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      # ── Código fuente ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node 20 ──────────────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── Rust stable ──────────────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache de compilación Rust (ahorra ~5 min por build)
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: behevc-tauri/src-tauri

      # ── Dependencias del sistema (solo Linux) ────────────────────────────
      - name: Linux — instalar dependencias WebKitGTK
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # ── Descargar ffmpeg + ffprobe para cada plataforma ──────────────────

      - name: macOS — descargar ffmpeg + ffprobe (evermeet.cx)
        if: startsWith(matrix.platform, 'macos')
        run: |
          mkdir -p behevc-tauri/src-tauri/resources
          curl -fsSL "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o ffmpeg.zip
          unzip -j ffmpeg.zip -d behevc-tauri/src-tauri/resources && rm ffmpeg.zip
          curl -fsSL "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip" -o ffprobe.zip
          unzip -j ffprobe.zip -d behevc-tauri/src-tauri/resources && rm ffprobe.zip
          chmod +x behevc-tauri/src-tauri/resources/ffmpeg
          chmod +x behevc-tauri/src-tauri/resources/ffprobe

      - name: Windows — descargar ffmpeg + ffprobe (gyan.dev)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "behevc-tauri/src-tauri/resources" | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $bin = (Get-ChildItem ffmpeg_tmp -Directory | Select-Object -First 1).FullName + "\bin"
          Copy-Item "$bin\ffmpeg.exe"  "behevc-tauri/src-tauri/resources/"
          Copy-Item "$bin\ffprobe.exe" "behevc-tauri/src-tauri/resources/"
          Remove-Item ffmpeg.zip, ffmpeg_tmp -Recurse -Force

      - name: Linux — descargar ffmpeg + ffprobe (johnvansickle.com)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p behevc-tauri/src-tauri/resources
          curl -fsSL "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" \
            -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          DIR=$(find . -maxdepth 1 -name 'ffmpeg-*-amd64-static' -type d | head -1)
          cp "$DIR/ffmpeg"  behevc-tauri/src-tauri/resources/
          cp "$DIR/ffprobe" behevc-tauri/src-tauri/resources/
          chmod +x behevc-tauri/src-tauri/resources/ffmpeg
          chmod +x behevc-tauri/src-tauri/resources/ffprobe
          rm -rf ffmpeg.tar.xz "$DIR"

      # ── Build ────────────────────────────────────────────────────────────
      - name: npm install
        working-directory: behevc-tauri
        run: npm install

      - name: tauri build
        working-directory: behevc-tauri
        run: npm run tauri build -- --target ${{ matrix.target }}

      # ── Subir artefactos ─────────────────────────────────────────────────

      - name: Upload — macOS DMG
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: BeHEVC-${{ matrix.label }}
          path: behevc-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload — Windows
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: BeHEVC-${{ matrix.label }}
          path: |
            behevc-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            behevc-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload — Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: BeHEVC-${{ matrix.label }}
          path: behevc-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
